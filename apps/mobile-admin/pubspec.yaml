name: mobile_admin
description: School All Ways Admin — staff app
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  phosphoricons_flutter: ^1.0.0
  intl: any
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  design_system:
    path: ../../packages/flutter/design_system
  core_models:
    path: ../../packages/flutter/core_models
  core_network:
    path: ../../packages/flutter/core_network
  core_auth:
    path: ../../packages/flutter/core_auth
  core_sync:
    path: ../../packages/flutter/core_sync
  core_ui:
    path: ../../packages/flutter/core_ui
  core_push:
    path: ../../packages/flutter/core_push
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
