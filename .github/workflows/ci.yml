name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Seed catalogue verification. No database needed, so it runs on every
      # push and is the cheapest guard against a restricted permission leaking
      # into a role, or a scope resolving wider than intended.
      # ---------------------------------------------------------------------
      - name: Verify permission catalogue and role bundles
        run: pnpm --filter @saw/db verify

      - name: Scope guard — :id routes with self/section perms must declare @Grant
        run: node scripts/check-scope-decorators.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # ---------------------------------------------------------------------
      # Schema drift: the committed migrations must match the schema files.
      # Catches "edited the schema, forgot to generate a migration".
      # ---------------------------------------------------------------------
      - name: Check for uncommitted migrations
        run: |
          pnpm db:generate --name ci_drift_check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::Schema changed but no migration was committed. Run pnpm db:generate."
            git status --porcelain db/migrations
            exit 1
          fi

  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saw_owner
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: school_all_ways
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Mirrors scripts/local-up.sh exactly. That script had drifted ahead of
      # this job for a long time without anyone noticing — a local Postgres
      # container keeps saw_app/saw_readonly and every 00x script applied
      # from whenever it was first bootstrapped, so the gap was invisible
      # until this job ran against a genuinely empty database. If you change
      # local-up.sh's sequence, change this step to match, and vice versa.
      - name: Apply schema, RLS and seeds
        env:
          DATABASE_URL: postgres://saw_owner:ci_password@localhost:5432/school_all_ways
        run: |
          echo "==> Bootstrap roles (needed before migrations that GRANT to saw_app)"
          psql "$DATABASE_URL" -f db/sql/000_bootstrap_roles.sql
          psql "$DATABASE_URL" -c "ALTER ROLE saw_app WITH PASSWORD 'ci_password'; ALTER ROLE saw_readonly WITH PASSWORD 'ci_password';"

          echo "==> Drizzle migrate"
          pnpm db:migrate

          echo "==> Apply extensions / sync / RLS SQL"
          psql "$DATABASE_URL" -f db/sql/001_extensions_and_sync.sql
          psql "$DATABASE_URL" -f db/sql/002_rls.sql
          psql "$DATABASE_URL" -f db/sql/003_auth_acting_user.sql
          psql "$DATABASE_URL" -f db/sql/004_join_token_lookup.sql
          psql "$DATABASE_URL" -f db/sql/005_public_signup.sql
          psql "$DATABASE_URL" -f db/sql/006_platform_grants.sql
          psql "$DATABASE_URL" -c "ALTER ROLE saw_app WITH PASSWORD 'ci_password'; ALTER ROLE saw_readonly WITH PASSWORD 'ci_password';"
          psql "$DATABASE_URL" -c "SELECT app_apply_tenant_rls(); SELECT app_attach_sync_triggers();"

          echo "==> Seed catalogues"
          pnpm db:seed

      # ---------------------------------------------------------------------
      # THE TEST THAT MATTERS. Creates two tenants, inserts a student into
      # each, then proves that as the restricted saw_app role, tenant A's
      # context can see exactly one student — never tenant B's.
      #
      # If this job ever fails, do not merge. It means one school can read
      # another school's data.
      # ---------------------------------------------------------------------
      - name: Cross-tenant leak test
        env:
          DATABASE_URL: postgres://saw_owner:ci_password@localhost:5432/school_all_ways
          APP_URL: postgres://saw_app:ci_password@localhost:5432/school_all_ways
        run: bash infra/scripts/test-tenant-isolation.sh

      # Import is the school's first real action — keep the 1k-row commit under 20s.
      - name: Demo seed for import bench
        env:
          DATABASE_URL: postgres://saw_owner:ci_password@localhost:5432/school_all_ways
        run: pnpm db:seed:demo

      - name: Import commit bench (1000 rows)
        env:
          DATABASE_URL: postgres://saw_owner:ci_password@localhost:5432/school_all_ways
        run: node scripts/bench-import.mjs --rows 1000

  # Independent of Postgres so a Flutter regression fails fast and legibly.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Each app has its OWN upload keystore, so each needs its own secrets.
      # A single shared ANDROID_KEYSTORE_BASE64 would silently sign both apps
      # with one upload key — no error, a valid-looking AAB, and no way to
      # transfer or re-sign one app independently later.
      matrix:
        include:
          - app: mobile-family
            keystore_secret: FAMILY_ANDROID_KEYSTORE_BASE64
            store_password_secret: FAMILY_ANDROID_KEYSTORE_PASSWORD
            key_password_secret: FAMILY_ANDROID_KEY_PASSWORD
          - app: mobile-admin
            keystore_secret: ADMIN_ANDROID_KEYSTORE_BASE64
            store_password_secret: ADMIN_ANDROID_KEYSTORE_PASSWORD
            key_password_secret: ADMIN_ANDROID_KEY_PASSWORD
    env:
      # Staging/pilot API. Override with repo variable MOBILE_API_BASE_URL.
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://api.school.techallways.com/v1' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets[matrix.keystore_secret] }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets[matrix.store_password_secret] }}
      # Both keystores use alias `upload` (see scripts/create-upload-keystores.sh).
      ANDROID_KEY_ALIAS: upload
      ANDROID_KEY_PASSWORD: ${{ secrets[matrix.key_password_secret] }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin matches the SDK already used locally (satisfies pubspec >=3.24.0).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Debug APK (unsigned graph check)
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ env.MOBILE_API_BASE_URL }}

      - name: Decode upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: apps/${{ matrix.app }}/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > key.properties

      - name: Release app bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ env.MOBILE_API_BASE_URL }}

      - name: Upload app bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-aab
          path: apps/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

