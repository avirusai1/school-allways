name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Seed catalogue verification. No database needed, so it runs on every
      # push and is the cheapest guard against a restricted permission leaking
      # into a role, or a scope resolving wider than intended.
      # ---------------------------------------------------------------------
      - name: Verify permission catalogue and role bundles
        run: pnpm --filter @saw/db verify

      - name: Scope guard — :id routes with self/section perms must declare @Grant
        run: node scripts/check-scope-decorators.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # ---------------------------------------------------------------------
      # Schema drift: the committed migrations must match the schema files.
      # Catches "edited the schema, forgot to generate a migration".
      # ---------------------------------------------------------------------
      - name: Check for uncommitted migrations
        run: |
          pnpm db:generate --name ci_drift_check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::Schema changed but no migration was committed. Run pnpm db:generate."
            git status --porcelain db/migrations
            exit 1
          fi

  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saw_owner
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: school_all_ways
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Mirrors scripts/local-up.sh exactly. That script had drifted ahead of
      # this job for a long time without anyone noticing — a local Postgres
      # container keeps saw_app/saw_readonly and every 00x script applied
      # from whenever it was first bootstrapped, so the gap was invisible
      # until this job ran against a genuinely empty database. If you change
      # local-up.sh's sequence, change this step to match, and vice versa.
      - name: Apply schema, RLS and seeds
        env:
          DATABASE_URL: postgres://saw_owner:ci_password@localhost:5432/school_all_ways
        run: |
          echo "==> Bootstrap roles (needed before migrations that GRANT to saw_app)"
          psql "$DATABASE_URL" -f db/sql/000_bootstrap_roles.sql
          psql "$DATABASE_URL" -c "ALTER ROLE saw_app WITH PASSWORD 'ci_password'; ALTER ROLE saw_readonly WITH PASSWORD 'ci_password';"

          echo "==> Drizzle migrate"
          pnpm db:migrate

          echo "==> Apply extensions / sync / RLS SQL"
          psql "$DATABASE_URL" -f db/sql/001_extensions_and_sync.sql
          psql "$DATABASE_URL" -f db/sql/002_rls.sql
          psql "$DATABASE_URL" -f db/sql/003_auth_acting_user.sql
          psql "$DATABASE_URL" -f db/sql/004_join_token_lookup.sql
          psql "$DATABASE_URL" -f db/sql/005_public_signup.sql
          psql "$DATABASE_URL" -f db/sql/006_platform_grants.sql
          psql "$DATABASE_URL" -c "ALTER ROLE saw_app WITH PASSWORD 'ci_password'; ALTER ROLE saw_readonly WITH PASSWORD 'ci_password';"
          psql "$DATABASE_URL" -c "SELECT app_apply_tenant_rls(); SELECT app_attach_sync_triggers();"
          # See scripts/local-up.sh for why this REVOKE must be repeated here.
          psql "$DATABASE_URL" -c "REVOKE UPDATE, DELETE ON public.audit_logs FROM saw_app; REVOKE UPDATE, DELETE ON public.pii_access_logs FROM saw_app;"

          echo "==> Seed catalogues"
          pnpm db:seed

      # ---------------------------------------------------------------------
      # THE TEST THAT MATTERS. Creates two tenants, inserts a student into
      # each, then proves that as the restricted saw_app role, tenant A's
      # context can see exactly one student — never tenant B's.
      #
      # If this job ever fails, do not merge. It means one school can read
      # another school's data.
      # ---------------------------------------------------------------------
      - name: Cross-tenant leak test
        env:
          DATABASE_URL: postgres://saw_owner:ci_password@localhost:5432/school_all_ways
          APP_URL: postgres://saw_app:ci_password@localhost:5432/school_all_ways
        run: bash infra/scripts/test-tenant-isolation.sh

      # Import is the school's first real action — keep the 1k-row commit under 20s.
      - name: Demo seed for import bench
        env:
          DATABASE_URL: postgres://saw_owner:ci_password@localhost:5432/school_all_ways
        run: pnpm db:seed:demo

      - name: Import commit bench (1000 rows)
        env:
          DATABASE_URL: postgres://saw_owner:ci_password@localhost:5432/school_all_ways
        run: node scripts/bench-import.mjs --rows 1000

  # Independent of Postgres so a Flutter regression fails fast and legibly.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Each app has its OWN upload keystore, so each needs its own secrets.
      # A single shared ANDROID_KEYSTORE_BASE64 would silently sign both apps
      # with one upload key — no error, a valid-looking AAB, and no way to
      # transfer or re-sign one app independently later.
      matrix:
        include:
          - app: mobile-family
            keystore_secret: FAMILY_ANDROID_KEYSTORE_BASE64
            store_password_secret: FAMILY_ANDROID_KEYSTORE_PASSWORD
            key_password_secret: FAMILY_ANDROID_KEY_PASSWORD
            google_services_secret: FAMILY_GOOGLE_SERVICES_JSON_BASE64
          - app: mobile-admin
            keystore_secret: ADMIN_ANDROID_KEYSTORE_BASE64
            store_password_secret: ADMIN_ANDROID_KEYSTORE_PASSWORD
            key_password_secret: ADMIN_ANDROID_KEY_PASSWORD
            google_services_secret: ADMIN_GOOGLE_SERVICES_JSON_BASE64
    env:
      # Staging/pilot API. Override with repo variable MOBILE_API_BASE_URL.
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://api.school.techallways.com/v1' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets[matrix.keystore_secret] }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets[matrix.store_password_secret] }}
      # Both keystores use alias `upload` (see scripts/create-upload-keystores.sh).
      ANDROID_KEY_ALIAS: upload
      ANDROID_KEY_PASSWORD: ${{ secrets[matrix.key_password_secret] }}
      # google-services.json is gitignored (same reasoning as the keystore: it
      # is per-app, not secret in the cryptographic sense, but there's no
      # reason to make it public either). Each app has its own file, so its
      # own secret — see docs/push-setup.md.
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets[matrix.google_services_secret] }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin matches the SDK already used locally (satisfies pubspec >=3.24.0).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Debug APK (unsigned graph check)
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ env.MOBILE_API_BASE_URL }}

      - name: Decode upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: apps/${{ matrix.app }}/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > key.properties

      - name: Decode google-services.json
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        working-directory: apps/${{ matrix.app }}/android/app
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json

      # Gated on BOTH secrets: signing without Firebase config would produce
      # an app that installs but silently never gets push notifications —
      # worse than failing loudly, since nothing would flag it.
      - name: Release app bundle (Play Store upload format)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ env.MOBILE_API_BASE_URL }}

      - name: Upload app bundle
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.GOOGLE_SERVICES_JSON_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-aab
          path: apps/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Play only ever accepts the AAB above. This release APK is purely for
      # sideloading a signed build onto a test device before publishing —
      # same signing config, just a different packaging format.
      - name: Release APK (sideload / manual testing)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.MOBILE_API_BASE_URL }}

      - name: Upload release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.GOOGLE_SERVICES_JSON_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Manual-trigger only (Actions tab -> Run workflow). Never runs on a plain
  # push, so merging to main does not silently redeploy production.
  #
  # The API is built and migrated ON THE VPS, not on this runner. The runner
  # is x86_64; the Oracle VPS is aarch64. argon2 (and any other native addon)
  # compiles a binary for whatever machine runs `pnpm install` — shipping a
  # runner-built node_modules to an arm64 box would silently fail to load.
  # The four web apps have no native deps, so those ARE built here and rsynced
  # as static files — that's safe and much faster than rebuilding them on a
  # shared VPS every deploy.
  #
  # web-marketing (Next.js) is deliberately not handled here yet — it isn't a
  # plain static `dist/` like the three Vite apps, and today's change doesn't
  # touch it. Deploying it needs its own look before automating.
  # ---------------------------------------------------------------------------
  deploy-production:
    runs-on: ubuntu-latest
    needs: [verify, tenant-isolation]
    if: github.event_name == 'workflow_dispatch'
    environment: production
    env:
      DEPLOY_HOST: 130.210.31.130
      DEPLOY_USER: saw-deploy
      DEPLOY_PATH: /var/www/techallways_school
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # VITE_API_BASE_URL is baked in at BUILD time, not read at runtime — every
      # app defaults to http://localhost:3001/v1 (see apps/*/src/lib/api.ts) if
      # this isn't set here, which is exactly the bug that shipped in the first
      # deploy-production run (2026-08-19): the built app called localhost from
      # the visitor's own browser instead of the real public API.
      - name: Build web apps (admin, family, control — no native deps, safe to build here)
        env:
          VITE_API_BASE_URL: https://school.techallways.com/api/v1
        run: |
          pnpm --filter @saw/web-admin build
          pnpm --filter @saw/web-family build
          pnpm --filter @saw/web-control build

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # apps/api/.env.production and the four *-site/site build-output dirs are
      # excluded — they don't exist in this checkout and --delete would wipe
      # them on the VPS otherwise. See docs/deploy-staging.md for why
      # .env.production lives inside the app root instead of /etc/saw/.
      - name: Sync source tree (API build/migrate happens on the VPS itself)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='apps/api/.env.production' \
            --exclude='apps/api/storage' \
            --exclude='apps/api/uploads' \
            --exclude='admin-site' \
            --exclude='family-site' \
            --exclude='control-site' \
            --exclude='site' \
            --exclude='.env' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Sync built web apps
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" apps/web-admin/dist/   "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin-site/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" apps/web-family/dist/  "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/family-site/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" apps/web-control/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/control-site/"

      - name: Build API, migrate, restart — on the VPS, correct architecture
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            cd '"$DEPLOY_PATH"'
            pnpm install --frozen-lockfile
            pnpm --filter @saw/api build
            set -a; source apps/api/.env.production; set +a
            pnpm db:migrate
            sudo systemctl restart saw-api
            sleep 3
            sudo systemctl is-active saw-api
            curl -fsS http://127.0.0.1:3001/health
          '

      - name: Record deployed commit
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo '${{ github.sha }}' > $DEPLOY_PATH/.deployed-sha"

